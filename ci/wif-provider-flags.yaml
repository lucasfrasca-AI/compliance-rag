# Flags for creating the GitHub OIDC provider in the `github` workload identity
# pool. Kept in a file rather than on the command line because the attribute
# condition contains `&&`, `||` and nested quotes, which do not survive a
# bracketed terminal paste intact.
#
# Applied with:
#   gcloud iam workload-identity-pools providers create-oidc github-provider \
#     --flags-file=ci/wif-provider-flags.yaml
#
# The attribute condition is the security boundary. Without it, any GitHub
# repository on the internet could mint a token for this pool. Three clauses:
#
#   repository        — only this repo
#   repository_owner  — only this owner, so a fork cannot satisfy the first
#                       clause by name alone
#   ref               — only main, or a pull-request ref from this repo
#
# attribute.ref must appear in the mapping for the condition to reference it.

---
- --location: global
  --workload-identity-pool: github
  --display-name: GitHub OIDC
  --issuer-uri: https://token.actions.githubusercontent.com
  --attribute-mapping:
    google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.repository_owner=assertion.repository_owner,attribute.ref=assertion.ref
  # One line on purpose: a block scalar would embed newlines in the CEL
  # expression. YAML double quotes carry the inner single quotes safely.
  --attribute-condition: "assertion.repository == 'lucasfrasca-AI/compliance-rag' && assertion.repository_owner == 'lucasfrasca-AI' && (assertion.ref == 'refs/heads/main' || assertion.ref.startsWith('refs/pull/'))"
