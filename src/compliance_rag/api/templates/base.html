<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{#- htmx's defaults insert an inline <style> and allow eval; the CSP forbids both. -#}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"historyEnabled":false}'>
<title>{% block title %}{% endblock %} - Contextum</title>
<link rel="icon" type="image/png" href="/static/contextum-logo.png">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/banner.css">
</head>
<body class="shell-page {% block body_class %}{% endblock %}">
{% include "_banner.html" %}
{#- The Contextum shell (#353): a sidebar, the page's own <main> in the
    centre, and a right-hand slot (`#sources`) a page may fill. Every page
    extends this file, so its nav and role follow the reader (`render`). -#}
<div class="shell">
<nav class="sidebar" aria-label="Main">
<a class="brand" href="/chats">
<span>Contextum</span>
</a>
{#- `nav` is built once, in `pages.nav_sections`, for this reader and this path. -#}
{% for section in nav %}
<div class="nav-section">
<p class="nav-heading">{{ section.heading }}</p>
<ul>
{% for item in section.items %}
<li><a href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
{% if item.children %}
<ul class="nav-recent" aria-label="Recent checks">
{% for child in item.children %}
<li><a href="{{ child.href }}"{% if child.active %} aria-current="page"{% endif %}>{{ child.label }}</a></li>
{% endfor %}
</ul>
{% endif %}
</li>
{% endfor %}
</ul>
</div>
{% endfor %}
<div class="me">
{% if member_email %}
<span class="avatar" aria-hidden="true">{{ member_email[:1] | upper }}</span>
<span class="me-email">{{ member_email }}</span>
{% endif %}
<button type="button" class="link" data-sign-out>Sign out</button>
</div>
</nav>
<div class="workspace">
{% block body %}{% endblock %}
{#- The right-hand slot. A page fills it (the chat's citation area now; the
    shared Sources panel, #354, next); empty, it takes no room. -#}
<aside id="sources" class="sources" aria-label="Sources">{% block sources %}{% endblock %}</aside>
</div>
</div>
<script src="/static/vendor/htmx/htmx.min.js" defer></script>
<script type="module" src="/static/ask.js"></script>
</body>
</html>
