name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Ledger schema tests connect here. Fresh per run, so migrations always
    # apply to an empty database — the same thing CI proves on every future
    # schema ticket, not just this one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U compliance -d compliance_rag"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://compliance:compliance@localhost:5432/compliance_rag

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Every file in db/ledger/, in filename order, against a fresh database.
      # This is what docker-compose's initdb.d mount does on a container's
      # first start; CI does it explicitly so a broken migration fails here,
      # not on someone's laptop.
      - name: Apply ledger migrations
        run: |
          set -e
          for f in db/ledger/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Tests
        run: uv run pytest

  reranker-onnx:
    name: reranker-onnx
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # The fp32 download (2.27GB) plus its own ONNX export (another
      # ~2.27GB of external-data tensors, briefly) don't fit in a standard
      # runner's free disk alongside its stock preinstalled toolchains
      # (found the hard way: a cache-miss run failed with ENOSPC mid-
      # quantization). None of .NET, Android, Haskell or the extra GHC
      # toolchains this image ships are used anywhere in this repo.
      # Unconditional (not just cache-miss): cheap, and the cache step
      # below hasn't run yet, so its output isn't available to gate on.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Keyed on the export script's own contents plus the pinned upstream
      # revision baked into it (BAAI_REVISION) — either changing invalidates
      # the cache. Hit: skip straight to the reranker service/client tests
      # below, no 2.27GB download, no torch/optimum install. Miss: the next
      # step re-converts (and re-verifies fp32-vs-int8 rank order) before
      # populating it.
      - name: Cache the converted ONNX artifact
        id: onnx-cache
        uses: actions/cache@v4
        with:
          path: models/reranker-onnx
          key: reranker-onnx-${{ hashFiles('scripts/export_reranker_onnx.py') }}

      - name: Install the export group (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: uv sync --group export --dev

      # Type-checks scripts/export_reranker_onnx.py and
      # tests/test_reranker_onnx_fidelity.py, both excluded from the main
      # `ci` job's pyright run (pyproject.toml) because torch/optimum
      # aren't resolvable there. Only meaningful with the export group
      # actually installed, same as the fidelity test below.
      - name: Type-check the export tooling (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: uv run pyright -p ci/reranker-fidelity-pyrightconfig.json

      - name: Export + quantize + verify fidelity (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: uv run python scripts/export_reranker_onnx.py

      # The dedicated fidelity test, not just the export script's own
      # internal gate — it needs torch/optimum, so it runs here, while the
      # export group is still installed, not after "Sync default
      # dependencies" strips it back out. Only meaningful on the same
      # cache miss that just rebuilt the artifact; on a cache hit the
      # artifact's fidelity was already proven when it was built, and
      # re-installing torch/optimum just to re-run the same check on
      # unchanged bytes would be exactly the wasted-every-run cost this
      # cache exists to avoid.
      - name: Re-verify fp32-vs-int8 fidelity independently (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: uv run pytest tests/test_reranker_onnx_fidelity.py -v

      # torch/optimum are never in this sync — the runtime service and its
      # tests load the artifact through plain onnxruntime only, same as the
      # Docker image (docker/reranker.Dockerfile).
      - name: Sync default dependencies
        run: uv sync --dev

      - name: Reranker service and client tests
        run: uv run pytest tests/test_reranker_service.py -v

  trace:
    name: trace-check
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    # A fork PR gets no GCP token: the OIDC provider's attribute condition pins
    # repository and owner, so requesting one would fail anyway. Skipping is
    # honest about that rather than failing on something a contributor cannot fix.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      id-token: write # mint the OIDC token for Workload Identity Federation
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      # Fail loudly rather than skipping: a silent auth failure would find zero
      # entries in both buckets, and the _Default half of the assertion would
      # read as a pass.
      - name: Authenticate to GCP (keyless, Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Assert the three variables are set
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::repository variable $v is not set"; missing=1; fi
          done
          exit $missing
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Exits 1 if the span is missing from compliance-rag-logs OR present in
      # _Default. Both halves are required (PHASES.md Phase 0).
      - name: Trace check — Sydney yes, _Default no
        run: uv run python ci/trace_check.py
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
