[project]
name = "compliance-rag"
version = "0.1.0"
description = "Check proposals and documents against company policy and law, with verbatim versioned citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "qdrant-client>=1.12,<2",
    "neo4j>=5.26,<6",
    "anthropic[vertex]>=0.39,<1",
    "google-cloud-aiplatform>=1.71,<2",
    "google-cloud-storage>=2.18,<3",
    "google-cloud-logging>=3.11,<4",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.24,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp>=1.28,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "sentencepiece>=0.2,<1",
    "onnxruntime>=1.19,<1.21",
    "transformers>=4.45,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "types-pyyaml>=6.0,<7",
]
# One-time (or rarely-repeated) ONNX export tooling for the reranker
# (issue #14). Deliberately not a main dependency and not in `dev`: torch +
# optimum are hundreds of MB and have nothing to do with the runtime service
# or the normal test suite, which only ever load the already-converted
# artifact via plain `onnxruntime`. `uv sync` (CI's default) never installs
# this group; only `scripts/export_reranker_onnx.py`'s own CI job does,
# via `uv sync --group export`.
export = [
    "torch>=2.4,<2.6",
    "optimum[onnxruntime]>=1.23,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The billable guard is a harness hook, not package code. Keeping it out of
# ruff's reach means a formatting pass can never silently rewrite a control.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]  # Any is allowed where a comment justifies it (CLAUDE.md)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
