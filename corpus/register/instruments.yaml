# The instrument register (#252, ADR-0051; CONTEXT.md: Instrument register).
#
# The names and aliases a question is read against to find the instruments it
# names, beside the "<Name> Act [year]" pattern. Reviewed content under D-01:
# `load_instrument_register` refuses this file while it is pending, and the
# app reads it when the pipeline is built, so an unsigned file stops the build.
#
# Three kinds of entry:
#   library_id  an instrument the library holds: held wherever a tenant
#               subscribes to it;
#   (neither)   one the library doesn't hold: held only where a tenant holds a
#               document whose recorded title contains one of its names;
#   part_of     a part of a library instrument, with the clause-path prefixes
#               it covers (plain string prefixes): held only where its
#               instrument is held and every committed selection manifest of it
#               selects into one of them.
#
# Names are matched case-insensitively, as whole words, longest first. Each is
# one line of letters, digits, spaces and plain punctuation: no quote, `]`,
# `;` or `[`, because a name reaches the model's fenced note.
#
# Drafted by the model at the human's request (#252); every entry is the
# model's. Reviewed and signed by Lucas Frasca in the chat on 2026-10-21, who
# kept the Interactive Gambling Act (APP 7.8(aa) names it) and dropped the bare
# "Part IIIC" alias: it appears in ordinary discussion of the Privacy Act
# itself, so flagging a question that merely mentions it would be noise.
#
# 2026-11-11 (#282): the NDB entry's `paths` tightened from `s26w` to the
# sections C2026C00227's selection now holds, ss 26WB-26WT (Part IIIC
# Divisions 1-3). `s26w` as a string prefix also matched s 26W, which is Part
# IIIB (APP code review), and Div 4's s 26WU and Div 5's ss 26X-26XH aren't
# selected. Each path below is a plain string prefix that can match none of
# `s26w/…`, `s26wu…` or `s26x…`. The human decided the tightening on #282
# ("The register's path list is tightened to s26wb…s26wt"), the model wrote
# the list, and the human signed it the same day. Consequence the human
# recorded: once any of Part IIIC is selected the scheme is held (ADR-0051
# decides "held" per part, by path overlap), so a question naming the scheme
# is answered from the held clauses, not flagged, including one about the
# Commissioner's powers in Div 4 or Div 5.

author: "model: Claude Opus 5.5 — drafted for #252 at Lucas Frasca's request; NDB paths tightened for #282"
reviewed_by: "Lucas Frasca"
date: "2026-11-11"

instruments:
  - known_as: "Privacy Act 1988"
    library_id: privacy-act-1988
    aliases: ["Privacy Act", "Privacy Act 1988 (Cth)", "Commonwealth Privacy Act"]

  - known_as: "Spam Act 2003"
    aliases: ["Spam Act", "Spam Act 2003 (Cth)"]

  - known_as: "Do Not Call Register Act 2006"
    aliases: ["Do Not Call Register Act", "DNCR Act"]

  - known_as: "Interactive Gambling Act 2001"
    aliases: ["Interactive Gambling Act"]

  - known_as: "Telecommunications (Interception and Access) Act 1979"
    aliases:
      - "Telecommunications (Interception and Access) Act"
      - "Telecommunications Interception and Access Act"
      - "TIA Act"

  - known_as: "General Data Protection Regulation (EU) 2016/679"
    aliases: ["GDPR", "EU GDPR", "General Data Protection Regulation"]

  - known_as: "Notifiable Data Breaches scheme (Part IIIC of the Privacy Act 1988)"
    part_of: privacy-act-1988
    paths:
      # Division 1: ss 26WB-26WD
      - s26wb
      - s26wc
      - s26wd
      # Division 2: ss 26WE-26WJ
      - s26we
      - s26wf
      - s26wg
      - s26wh
      - s26wj
      # Division 3: ss 26WK-26WT
      - s26wk
      - s26wl
      - s26wm
      - s26wn
      - s26wp
      - s26wq
      - s26wr
      - s26ws
      - s26wt
    aliases:
      - "Notifiable Data Breaches scheme"
      - "Notifiable Data Breach scheme"
      - "NDB scheme"
      - "notifiable data breaches"
