# Applicability golden set (issue #117): Acme profiles in, Privacy Act
# obligation outcomes out. Gated in CI (tests/test_applicability_gate.py)
# through the fake and through Track A over Neo4j.
#
# Drafted by the model from C2026C00227 at the human's request; reviewed and
# signed by Lucas Frasca on 2026-10-13. A label is a label only once
# `reviewed_by` signs it (D-01; CONTEXT.md: Golden set), and CI refuses
# unsigned labels.
#
# 2026-10-20 (#211, ADR-0047): s6DA(2)'s formula is an image, so the clause is
# incomplete, and Track A holds a turnover leaf resting on it unassessable for
# a financial year the facts show, or leave open, was a part year (Lucas
# Frasca's decision 2 on #211, which authorised re-signing the labels that
# move). Run on the fake and on Neo4j, only GA-04 moves: Acme started on
# 2 March 2015, so FY2014-15, the first year s6D(4)(a) reads, is a part year,
# and whether it was ever over $3,000,000 can't be settled. Its 35 APPs go
# from not applicable to unassessable, app-entity and organisation from false
# to unknown, with no question; APP 11.1 now cites s6D(4)(a) and s6DA(2), not
# s6E(1) and s6EA(1), which decide nothing once the role is unknown. GA-01,
# GA-02, GA-03, GA-05, GA-06 and GA-07 are unchanged (GA-03's reasons now name
# s 6DA(2) too; its outcomes and questions don't move). Re-signed by Lucas
# Frasca, 2026-10-20.
#
# Acme Pty Ltd is the synthetic company of docs/research/fixtures/
# synthetic-policies/. Its facts here (when it started, its turnover each year,
# what it answered) are invented for the cases: the policies say nothing
# about them. As of 12 October 2026 the current financial year is FY2026-27,
# so s6D(1)'s "previous financial year" is FY2025-26 (`financial_year: 2025`).
#
# The base profile every case starts from: a body corporate (Acme Pty Ltd),
# not an agency, party or State authority, carrying on one business since
# 2 March 2015.

