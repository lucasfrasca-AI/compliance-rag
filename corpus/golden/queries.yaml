# Golden set (CONTEXT.md: Golden set; issue #27).
#
# DRAFT — NOT YET A LABEL. Every expected_clause_ids value below was proposed by
# the author named in `author`. It becomes a label only when the person named in
# `reviewed_by` has corrected it and signed off by setting `date`. Their
# correction is the human judgement D-01 requires; this draft is a proposal.
#
# One file, file-level front matter, matching corpus/mappings/README.md.
# tenant_id carries scope: `_public` sees the whole library by ownership
# (ADR-0020); `acme` sees only its own documents, since it subscribes to nothing
# here. A single retrieve() never crosses that boundary, so no cross_clause
# entry spans both.

author: "Claude Opus 5.5 — query text drafted for issue #27; every expected_clause_ids value is a DRAFT until reviewed_by signs off"
reviewed_by: "PENDING — the human reviewer, same identity convention as corpus/instruments manifest.yaml"
date: "PENDING — the date the reviewer corrects and signs off, not the draft date"

queries:
