  # ---- cross_clause: several clauses jointly relevant, one scope -----------
  - id: GQ-18
    category: cross_clause
    query: What are all the specific ways personal information must be protected under APP 11.1?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids:
      - privacy-act-1988:C2026C00227:sch1/app11/1
      - privacy-act-1988:C2026C00227:sch1/app11/1/a
      - privacy-act-1988:C2026C00227:sch1/app11/1/b
  - id: GQ-19
    category: cross_clause
    query: What's the difference between what APP 10 requires at collection versus at use or disclosure?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids:
      - privacy-act-1988:C2026C00227:sch1/app10/1
      - privacy-act-1988:C2026C00227:sch1/app10/2
  - id: GQ-20
    category: cross_clause
    query: Who counts as an "agency" versus a "State or Territory authority" under the Act?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids:
      - privacy-act-1988:C2026C00227:s6/1/agency
      - privacy-act-1988:C2026C00227:s6c/3
  - id: GQ-21
    category: cross_clause
    query: What does our Data Security and Retention Policy say about keeping customer information safe, covering both encryption and who can access it?
    tenant_id: acme
    as_of: 2026-10-01
    expected_clause_ids:
      - acme/data-security-policy:v1:1/1
      - acme/data-security-policy:v1:2/1
  - id: GQ-22
    category: cross_clause
    query: What are our retention rules for customer accounts versus payment card details?
    tenant_id: acme
    as_of: 2026-10-01
    expected_clause_ids:
