      - acme/marketing-policy:v1:1/1
    notes: >
      The contradicting pair docs/research/synthetic-policy-set.md documents
      (D1 §3.2 opt-in vs D5 §1.1 opt-out). Both must surface for a reader to see
      the conflict.
  - id: GQ-25
    category: cross_clause
    query: Are our overseas vendor arrangements properly assessed against the Australian Privacy Principles?
    tenant_id: acme
    as_of: 2026-10-01
    expected_clause_ids:
      - acme/privacy-policy:v1:4/1
      - acme/vendor-policy:v1:2/1
    notes: >
      The second documented conflict (D1 §4.1's "reasonable steps" vs D4 §2.1
      naming a vendor with no APP-equivalent law and §2.2 waiving assessment).
