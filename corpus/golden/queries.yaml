      - acme/data-security-policy:v1:3/2
  - id: GQ-23
    category: cross_clause
    query: How does Acme handle a customer's request to see their data compared to a request to fix it?
    tenant_id: acme
    as_of: 2026-10-01
    expected_clause_ids:
      - acme/access-correction-procedure:v1:2/1
      - acme/access-correction-procedure:v1:3/1
  - id: GQ-24
    category: cross_clause
    query: Can Acme use a customer's details for marketing without getting their consent first?
    tenant_id: acme
    as_of: 2026-10-01
    expected_clause_ids:
