  # ---- paraphrase: one clause, said differently ----------------------------
  - id: GQ-09
    category: paraphrase
    query: What must a company do to keep personal data safe from being misused or lost?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids: [privacy-act-1988:C2026C00227:sch1/app11/1/a]
  - id: GQ-10
    category: paraphrase
    query: If we no longer need someone's personal details, what are we supposed to do with them?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids: [privacy-act-1988:C2026C00227:sch1/app11/2]
  - id: GQ-11
    category: paraphrase
    query: Does information we collect about customers need to stay accurate and up to date?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids: [privacy-act-1988:C2026C00227:sch1/app10/1]
  - id: GQ-12
    category: paraphrase
    query: What makes a business small enough to be exempt from counting as an organisation under the Act?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids: [privacy-act-1988:C2026C00227:s6c/1]
  - id: GQ-13
    category: paraphrase
    query: How does unauthorised access or disclosure of personal information need to be guarded against?
    tenant_id: _public
    as_of: 2026-10-01
    expected_clause_ids: [privacy-act-1988:C2026C00227:sch1/app11/1/b]
  - id: GQ-14
