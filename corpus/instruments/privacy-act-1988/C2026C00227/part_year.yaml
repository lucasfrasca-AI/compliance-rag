# C2026C00227 governs (#211, ADR-0047 Decision 6, ADR-0052).
#
# The model shaped this file: `part_year_only: {started: business_started_on}`
# is its encoding of Lucas Frasca's decision 2 (#211, 2026-10-20):
#
#   > Mark them unassessable only when the facts leave open that the business
#   > ran for part of a year, not whenever the formula is cited.
#
# read against s6DA(2)'s own stored words: "However, if a business has been
# carried on for only part of a financial year, its annual turnover for the
# financial year is the amount worked out using the formula:". `started` is
# the profile fact the signed mapping already reads for when the business
