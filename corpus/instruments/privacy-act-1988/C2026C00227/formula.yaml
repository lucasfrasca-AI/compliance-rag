# The signed form of s 6DA(2)'s turnover formula (#338, ADR-0058;
# docs/research/s6da-2-pdf-extraction.md, #276).
#
# The pinned ePub (sha256 6d0a43e5…5c3b) sets the formula as an image, so the
# parse stores s 6DA(2) incomplete (ADR-0047). The Register's PDF of the same
# compilation, C2026C00227, sets it as text on page 62 (printed page 44). The
# PDF supplies the words: src/compliance_rag/corpus/pdf_formula.py reads them
# off the page by geometry and refuses unless they are exactly `words` below,
# block by block and in order. This file supplies only what the PDF can't
# say: the reading convention (the numerator is above the bar; the one
# SymbolMT glyph, which the PDF's text layer maps to U+00B4, is the
# multiplication sign U+00D7) and the form a fraction is written in a line of
# text, `(numerator ÷ denominator)` in brackets.
#
# Lucas Frasca signed the canonical text on 2026-11-11 ("sign 1", #338):
#
#   > However, if a business has been carried on for only part of a financial
#   > year, its annual turnover for the financial year is the amount worked out
#   > using the formula: Amount that would be the annual turnover of the
#   > business under subsection (1) if the part were a whole financial year ×
#   > (Number of days in the whole financial year ÷ Number of days in the part)
#
# with the ×, the ÷ and the brackets as the signed convention. The model
# drafted the form and this file's fields on 2026-11-08, so the model is its
# author (ADR-0052); the fields encode what he signed and nothing more.
#
# Corpus content under D-01: a file still pending review is refused, not used.

author: "model:claude-opus-5-5 — drafted 2026-11-08 (#276); fields encode the text and convention Lucas Frasca signed"
reviewed_by: "Lucas Frasca"
date: 2026-11-11
source_clause_ids:
  - privacy-act-1988:C2026C00227:s6da/2

formulas:
  - clause_id: privacy-act-1988:C2026C00227:s6da/2
    completes:
      reason: image_not_text
      detail: "the formula is not available in text form"
    source:
      url: https://www.legislation.gov.au/C2004A03712/2026-06-04/2026-06-04/text/original/pdf
      sha256: 443e895f1e1536763af78e4553d469b0857a84553ca0c011ed796a623f954e38
      page: 62
    convention:
      numerator: above_the_bar
      operator:
        font: SymbolMT
        extracted: "´"
        reads_as: "×"
      form: "{left} {operator} ({numerator} ÷ {denominator})"
    words:
      left: "Amount that would be the annual turnover of the business under subsection (1) if the part were a whole financial year"
      numerator: "Number of days in the whole financial year"
      denominator: "Number of days in the part"
    canonical_text: "However, if a business has been carried on for only part of a financial year, its annual turnover for the financial year is the amount worked out using the formula: Amount that would be the annual turnover of the business under subsection (1) if the part were a whole financial year × (Number of days in the whole financial year ÷ Number of days in the part)"
