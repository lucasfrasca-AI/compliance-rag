# Privacy Act 1988 (Cth): the exceptions to the obligations privacy-act-1988.yaml
# signs (issue #164, ADR-0037).
#
# Corpus content under D-01: drafted by the model at the human's request,
# reviewed and signed by Lucas Frasca on 2026-10-15, who added APP 3.7 at
# sign-off: a scope limit disapplies the obligation for material outside the scope,
# which is what an exception does. scripts/load_mappings.py refuses any file
# whose reviewer is still pending. The signed privacy-act-1988.yaml is not
# edited: these entries name its obligations by id.
#
# An exception is a clause that says when an obligation does not apply, or is
# displaced. It decides nothing about whether the obligation applies. It is
# what an answer citing the obligation must not leave out: Track B's scope
# includes it, and answer() delivers it with the obligation's clause.
#
# privacy-act-1988.yaml lists the APP subclauses that are clauses, not
# obligations: 1.1, 2.2, 3.4, 3.7, 4.2, 4.4, 5.2, 6.2, 6.3, 6.6, 6.7, 7.2-7.6,
# 7.8, 8.2, 8.3, 9.3, 11.3, 12.2, 12.3, 12.6, 12.10. Exceptions, here: 2.2, 3.4,
# 3.7, 6.2, 6.3, 6.7, 7.2, 7.3, 7.4, 7.5, 7.8, 8.2, 8.3, 9.3, 12.2, 12.3.
# Qualifiers, which say how an obligation is satisfied rather than when it
# doesn't apply (privacy-act-1988-qualifiers.yaml, ADR-0044): 5.2, 7.6, 11.3,
# 12.6. Neither: 1.1 (an object clause); 4.2 and 12.10 (permissions: "may"
# creates a separate allowance and changes neither whether nor how an
# obligation applies); 6.6 (a deeming rule, a possible third category); 4.4
# (what applies when 4.3 doesn't).
#
# The first draft had the parsed text of APP 10 and 11 only (the checked-in
# fixtures). Every pairing has since been read against the parsed text of the
# pinned C2026C00227 source, and the PR's review table quotes each exception's
# opening words. 8.3 was added then: 8.2(aa) disapplies 8.1 where "subclause
# 8.3 applies", the prescribed-countries scheme.
#
# The comments below are the model's paraphrase, never quotes. Each
# obligation's entry lists its exceptions; an exception that displaces a whole
# principle (3.7, 6.7, 7.8) is listed for every obligation of that principle.

