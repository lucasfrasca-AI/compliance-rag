# Privacy Act 1988 (Cth): the exceptions to the obligations privacy-act-1988.yaml
# signs (issue #164, ADR-0037).
#
# DRAFT, AWAITING REVIEW (D-01). Drafted by the model at the human's request.
# scripts/load_mappings.py refuses this file, and CI fails, until Piero Frasca
# signs it: reviewed_by becomes his name and `date` the sign-off. The signed
# privacy-act-1988.yaml is not edited: these entries name its obligations by id.
#
# An exception is a clause that says when an obligation does not apply, or is
# displaced. It decides nothing about whether the obligation applies. It is
# what an answer citing the obligation must not leave out: Track B's scope
# includes it, and answer() delivers it with the obligation's clause.
#
# privacy-act-1988.yaml lists the APP subclauses that are clauses, not
# obligations: 1.1, 2.2, 3.4, 3.7, 4.2, 4.4, 5.2, 6.2, 6.3, 6.6, 6.7, 7.2-7.6,
# 7.8, 8.2, 8.3, 9.3, 11.3, 12.2, 12.3, 12.6, 12.10. Drafted as exceptions: 2.2,
# 3.4, 6.2, 6.3, 6.7, 7.2, 7.3, 7.4, 7.5, 7.8, 8.2, 9.3, 12.2, 12.3. Not
# exceptions (the PR's review table gives the reason for each): 1.1 (object),
# 3.7, 5.2, 6.6, 11.3 (definitional), 4.2, 7.6, 12.6, 12.10 (permissions), 4.4
# (what applies when 4.3 doesn't). Not classified: 8.3.
#
# The drafting session had the parsed text of APP 10 and 11 only (the
# checked-in fixtures). Every other pairing is the model's reading of the APPs
# and must be checked against the clause text of C2026C00227 before signing.
#
# The comments below are the model's paraphrase, never quotes. Each
# obligation's entry lists its exceptions; an exception that displaces a whole
# principle (6.7, 7.8) is listed for every obligation of that principle.

