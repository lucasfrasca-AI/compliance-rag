# Privacy Act 1988 (Cth): who the Australian Privacy Principles bind, and the
# obligations they impose (issue #118).
#
# DRAFTED BY THE MODEL, NOT YET REVIEWED. Corpus content under D-01: the model
# authored it at the human's request; the human reviews it, and only then is
# `reviewed_by` set and the file loaded into the graph. scripts/load_mappings.py
# refuses a file whose reviewer is still pending.
#
# Read from compilation C2026C00227 (in force from 4 June 2026). Every clause id
# below is a clause of that compilation; every condition and actor is
# DERIVED_FROM the clauses it was read from, and those clauses are what an
# answer cites (ADR-0027, ADR-0028).
#
# Dates. The APPs, `APP entity` and the current form of s15 commenced on
# 12 March 2014 (Privacy Amendment (Enhancing Privacy Protection) Act 2012,
# Endnote 3), so everything here is dated from then, except s6E(1D), which the
# Treasury Laws Amendment (Consumer Data Right) Act 2019 inserted from
# 13 August 2019. Earlier forms of ss 6C-6EA (in force from 21 December 2001)
# gated the NPPs, which this corpus doesn't hold. The only text loaded is from
# 4 June 2026, so before then Track A reports every obligation unassessable for
# want of a compilation (ADR-0028), whatever these dates say.
#
# The applicability tree (s15 -> s6(1) -> s6C -> s6D -> s6DA/s6E/s6EA):
#
#   APP entity = agency OR organisation                              s6(1)
#   organisation = legal form (s6C(1)(a)-(e))
#                  AND NOT (registered political party OR agency
#                           OR State/Territory authority)            s6C(1)
#                  AND (NOT small business operator
#                       OR deemed an organisation (s6E)
#                       OR opted in (s6EA))                          s6C(1), s6E, s6EA
#   small business operator = small business (s6D(1)/(2), turnover per s6DA)
#                  AND carries on no business that isn't small       s6D(3)
#                  AND NOT any s6D(4) exception (a)-(f), with the
#                      (5)-(8) carve-backs folded into the questions s6D(4)-(8)
#                  AND NOT related to a non-small body corporate     s6D(9)
#
# For a business under the threshold, four routes can still bring it under the
# APPs: an s6D(4) exception, an s6D(9) related body, s6E deeming, and the s6EA
# opt-in. Each is a condition below and each unknown leaf is a question.

