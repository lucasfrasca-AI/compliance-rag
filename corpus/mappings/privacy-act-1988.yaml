# ---------------------------------------------------------------------------
# Who: the roles the Act defines
# ---------------------------------------------------------------------------

actors:
  - id: privacy-act-1988/actor/app-entity
    name: APP entity
    description: An agency or organisation (s6(1)). An APP entity must not breach an APP (s15).
    clause_ids:
      - privacy-act-1988:C2026C00227:s15
      - privacy-act-1988:C2026C00227:s6/1/app-entity
    qualified_by: COND-PA-APP-ENTITY
    valid_from: 2014-03-12
  - id: privacy-act-1988/actor/organisation
    name: Organisation
    description: >
      An APP entity that is an organisation (s6C): bound by the APPs that apply
      only to organisations (APP 3.2, 6.4, 7, 9, 12.8).
    clause_ids:
      - privacy-act-1988:C2026C00227:s6/1/organisation
      - privacy-act-1988:C2026C00227:s6c/1
    qualified_by: COND-PA-ORGANISATION
    valid_from: 2014-03-12
  - id: privacy-act-1988/actor/agency
    name: Agency
    description: >
      An APP entity that is an agency (s6(1)): bound by the APPs that apply only
      to agencies (APP 3.1, 12.7).
    clause_ids:
      - privacy-act-1988:C2026C00227:s6/1/agency
    qualified_by: COND-PA-AGENCY
    valid_from: 2014-03-12

# ---------------------------------------------------------------------------
# The condition tree
# ---------------------------------------------------------------------------

conditions:
  # ---- APP entity: s6(1) -----------------------------------------------------
  - id: COND-PA-APP-ENTITY
    description: An APP entity is an agency or an organisation.
    clause_ids: [privacy-act-1988:C2026C00227:s6/1/app-entity]
    valid_from: 2014-03-12
    any_of: [COND-PA-AGENCY, COND-PA-ORGANISATION]

  - id: COND-PA-AGENCY
    description: The entity is an agency within the meaning of s6(1).
    clause_ids: [privacy-act-1988:C2026C00227:s6/1/agency]
    valid_from: 2014-03-12
    leaf: {field: is_agency, test: eq, value: true}
    question: >
      Is the entity an agency within the meaning of s6(1) of the Privacy Act —
      for example a Minister, a Department, or a body established for a public
      purpose by or under a Commonwealth enactment?
    unassessable_reason: Nobody has said whether the entity is an agency (s6(1)).

  # ---- organisation: s6C(1) --------------------------------------------------
  - id: COND-PA-ORGANISATION
    description: >
      An organisation is an individual, body corporate, partnership, other
      unincorporated association or trust that is not a small business
      operator, a registered political party, an agency, or a State or
      Territory authority or prescribed instrumentality (s6C(1)) — or a small
      business operator the Act treats as an organisation (s6E, s6EA).
    clause_ids: [privacy-act-1988:C2026C00227:s6c/1]
    valid_from: 2014-03-12
    all_of: [COND-PA-LEGAL-FORM, COND-PA-NOT-EXCLUDED-BODY, COND-PA-NOT-SBO-OR-TREATED-AS-ORGANISATION]

  - id: COND-PA-LEGAL-FORM
    description: >
      The entity is an individual, a body corporate, a partnership, any other
      unincorporated association, or a trust.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6c/1/a
      - privacy-act-1988:C2026C00227:s6c/1/b
      - privacy-act-1988:C2026C00227:s6c/1/c
      - privacy-act-1988:C2026C00227:s6c/1/d
      - privacy-act-1988:C2026C00227:s6c/1/e
    valid_from: 2014-03-12
    leaf:
      field: legal_form
      test: in
      value: [individual, body_corporate, partnership, unincorporated_association, trust]
    question: >
      What is the entity's legal form: an individual, a body corporate, a
      partnership, another unincorporated association, or a trust?
    unassessable_reason: The entity's legal form is not recorded (s6C(1)).

  - id: COND-PA-NOT-EXCLUDED-BODY
    description: Not one of the bodies s6C(1) excludes from being an organisation.
    clause_ids: [privacy-act-1988:C2026C00227:s6c/1]
    valid_from: 2014-03-12
    not: COND-PA-EXCLUDED-BODY

  - id: COND-PA-EXCLUDED-BODY
    description: >
      A registered political party, an agency, or a State or Territory
      authority or prescribed instrumentality of a State or Territory.
    clause_ids: [privacy-act-1988:C2026C00227:s6c/1]
    valid_from: 2014-03-12
    any_of: [COND-PA-POLITICAL-PARTY, COND-PA-AGENCY, COND-PA-STATE-AUTHORITY]

  - id: COND-PA-POLITICAL-PARTY
    description: The entity is a registered political party.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6c/1
      - privacy-act-1988:C2026C00227:s6/1/registered-political-party
    valid_from: 2014-03-12
    leaf: {field: is_registered_political_party, test: eq, value: true}
    question: >
      Is the entity a political party registered under Part XI of the
      Commonwealth Electoral Act 1918?
    unassessable_reason: Nobody has said whether the entity is a registered political party (s6C(1)).

  - id: COND-PA-STATE-AUTHORITY
    description: >
      The entity is a State or Territory authority (s6C(3)) or a prescribed
      instrumentality of a State or Territory.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6c/1
      - privacy-act-1988:C2026C00227:s6c/3
    valid_from: 2014-03-12
    leaf: {field: is_state_or_territory_authority, test: eq, value: true}
    question: >
      Is the entity a State or Territory authority within s6C(3) — for example a
      State Department, or a body established for a public purpose under a
      State or Territory law — or a prescribed instrumentality of a State or
      Territory?
    unassessable_reason: Nobody has said whether the entity is a State or Territory authority (s6C(1), (3)).

  # ---- small business operator, or treated as an organisation anyway --------
  - id: COND-PA-NOT-SBO-OR-TREATED-AS-ORGANISATION
    description: >
      Not a small business operator — or, if one, a small business operator the
      Act applies to as if it were an organisation (s6E, s6EA).
    clause_ids:
      - privacy-act-1988:C2026C00227:s6c/1
      - privacy-act-1988:C2026C00227:s6e/1
      - privacy-act-1988:C2026C00227:s6ea/1
    valid_from: 2014-03-12
    any_of: [COND-PA-NOT-SBO, COND-PA-S6E-TREATED-AS-ORGANISATION, COND-PA-S6EA-OPTED-IN]

  - id: COND-PA-NOT-SBO
    description: The entity is not a small business operator.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6c/1
      - privacy-act-1988:C2026C00227:s6/1/small-business-operator
    valid_from: 2014-03-12
    not: COND-PA-SBO

  - id: COND-PA-SBO
    description: >
      A small business operator carries on one or more small businesses and no
      business that is not a small business (s6D(3)), is caught by none of the
      s6D(4) exceptions, and is not a body corporate related to a body
      corporate that carries on a business that is not small (s6D(9)).
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/3
      - privacy-act-1988:C2026C00227:s6d/3/a
    valid_from: 2014-03-12
    all_of:
      - COND-PA-SMALL-BUSINESS
      - COND-PA-NO-OTHER-BUSINESS-NOT-SMALL
      - COND-PA-NO-S6D4-EXCEPTION
      - COND-PA-NOT-RELATED-TO-NON-SMALL

  # ---- s6D(1), (2), s6DA: the turnover threshold -------------------------------
  - id: COND-PA-SMALL-BUSINESS
    description: >
      The business is a small business at the test time: annual turnover for
      the previous financial year of $3,000,000 or less (s6D(1)) — or, if it
      wasn't carried on at any time in the previous financial year, for the
      current year (s6D(2)).
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/1
      - privacy-act-1988:C2026C00227:s6d/2
    valid_from: 2014-03-12
    any_of: [COND-PA-SMALL-BY-PREVIOUS-YEAR, COND-PA-SMALL-BY-CURRENT-YEAR]

  - id: COND-PA-SMALL-BY-PREVIOUS-YEAR
    description: Carried on in the previous financial year, with annual turnover for that year of $3,000,000 or less.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/1]
    valid_from: 2014-03-12
    all_of: [COND-PA-CARRIED-ON-LAST-YEAR, COND-PA-TURNOVER-PREVIOUS-YEAR-UNDER]

  - id: COND-PA-CARRIED-ON-LAST-YEAR
    description: The business was carried on at some time in the previous financial year.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/2]
    valid_from: 2014-03-12
    leaf:
      field: business_started_on
      test: before
      value: start_of_current_financial_year
    question: When did the entity start to carry on its business?
    unassessable_reason: >
      The date the business started is not recorded, so which financial year's
      turnover s6D reads can't be settled (s6D(1), (2)).

  - id: COND-PA-TURNOVER-PREVIOUS-YEAR-UNDER
    description: Annual turnover (s6DA) for the previous financial year is $3,000,000 or less.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/1
      - privacy-act-1988:C2026C00227:s6da/1
      - privacy-act-1988:C2026C00227:s6/1/annual-turnover
    valid_from: 2014-03-12
    leaf:
      field: annual_turnover_aud
      period: previous_financial_year
      test: lte
      value: 3000000
    question: >
      What was the business's annual turnover for the previous financial year,
      worked out as s6DA(1) says (sales, commission, repair and service, rent
      and hire, government subsidies, interest, royalties and dividends, and
      other operating income)?
    unassessable_reason: No annual turnover is recorded for the previous financial year (s6D(1), s6DA).

  - id: COND-PA-SMALL-BY-CURRENT-YEAR
    description: Not carried on in the previous financial year, with annual turnover for the current year of $3,000,000 or less.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/2]
    valid_from: 2014-03-12
    all_of: [COND-PA-NOT-CARRIED-ON-LAST-YEAR, COND-PA-TURNOVER-CURRENT-YEAR-UNDER]

  - id: COND-PA-NOT-CARRIED-ON-LAST-YEAR
    description: The business was not carried on at any time in the previous financial year.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/2]
    valid_from: 2014-03-12
    not: COND-PA-CARRIED-ON-LAST-YEAR

  - id: COND-PA-TURNOVER-CURRENT-YEAR-UNDER
    description: Annual turnover (s6DA, including s6DA(2) for part of a year) for the current year is $3,000,000 or less.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/2
      - privacy-act-1988:C2026C00227:s6da/1
      - privacy-act-1988:C2026C00227:s6da/2
    valid_from: 2014-03-12
    leaf:
      field: annual_turnover_aud
      period: current_financial_year
      test: lte
      value: 3000000
    question: >
      What is the business's annual turnover for the current financial year,
      worked out as s6DA says — for a business carried on for only part of the
      year, by the s6DA(2) formula?
    unassessable_reason: No annual turnover is recorded for the current financial year (s6D(2), s6DA).

  # ---- s6D(3)(b): no other business that isn't small ----------------------------
  - id: COND-PA-NO-OTHER-BUSINESS-NOT-SMALL
    description: The entity does not carry on a business that is not a small business.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/3/b]
    valid_from: 2014-03-12
    not: COND-PA-OTHER-BUSINESS-NOT-SMALL

  - id: COND-PA-OTHER-BUSINESS-NOT-SMALL
    description: The entity carries on another business whose annual turnover is over $3,000,000.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/3/b]
    valid_from: 2014-03-12
    leaf: {field: carries_on_another_business_not_small, test: eq, value: true}
    question: >
      Does the entity carry on any other business that is not a small business
      (annual turnover over $3,000,000)?
    unassessable_reason: Nobody has said whether the entity carries on another business that is not small (s6D(3)(b)).

  # ---- s6D(4): the six exceptions, with the (5)-(8) carve-backs -------------------
  - id: COND-PA-NO-S6D4-EXCEPTION
    description: None of the s6D(4) exceptions applies.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/4]
    valid_from: 2014-03-12
    not: COND-PA-S6D4-EXCEPTION

  - id: COND-PA-S6D4-EXCEPTION
    description: >
      An s6D(4) exception applies: it is not a small business operator if any
      of (a)-(f) is true.
    clause_ids: [privacy-act-1988:C2026C00227:s6d/4]
    valid_from: 2014-03-12
    any_of:
      - COND-PA-S6D4A-EVER-OVER-THRESHOLD
      - COND-PA-S6D4B-HEALTH
      - COND-PA-S6D4C-DISCLOSES-FOR-BENEFIT
      - COND-PA-S6D4D-PAYS-TO-COLLECT
      - COND-PA-S6D4E-COMMONWEALTH-CSP
      - COND-PA-S6D4F-CREDIT-REPORTING-BODY

  - id: COND-PA-S6D4A-EVER-OVER-THRESHOLD
    description: >
      It carries on a business that has had an annual turnover of more than
      $3,000,000 for a financial year that has ended after the later of when it
      started to carry on the business and the commencement of s6D
      (21 December 2001).
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/4/a
      - privacy-act-1988:C2026C00227:s6d/4/a/i
      - privacy-act-1988:C2026C00227:s6d/4/a/ii
      - privacy-act-1988:C2026C00227:s6da/1
    valid_from: 2014-03-12
    leaf:
      field: annual_turnover_aud
      period: any_ended_financial_year
      test: gt
      value: 3000000
      since_field: business_started_on
      not_before: 2001-12-21
    question: >
      What was the business's annual turnover (s6DA) for each financial year
      that has ended since it started (or since 21 December 2001, if later)?
    unassessable_reason: >
      Annual turnover is not recorded for every financial year since the
      business started, so whether it has ever been over $3,000,000 can't be
      settled (s6D(4)(a)).

  - id: COND-PA-S6D4B-HEALTH
    description: >
      It provides a health service to another individual and holds health
      information other than in an employee record.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/4/b
      - privacy-act-1988:C2026C00227:s6d/5
      - privacy-act-1988:C2026C00227:s6d/6
    valid_from: 2014-03-12
    all_of: [COND-PA-PROVIDES-HEALTH-SERVICE, COND-PA-HOLDS-HEALTH-INFORMATION]

  - id: COND-PA-PROVIDES-HEALTH-SERVICE
    description: In the course of a business it carries on, it provides a health service to another individual.
    clause_ids:
      - privacy-act-1988:C2026C00227:s6d/4/b
      - privacy-act-1988:C2026C00227:s6d/6
      - privacy-act-1988:C2026C00227:s6/1/health-service
    valid_from: 2014-03-12
    leaf: {field: provides_health_service, test: eq, value: true}
    question: >
