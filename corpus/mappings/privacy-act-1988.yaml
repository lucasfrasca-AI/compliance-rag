# ---------------------------------------------------------------------------
# What: the obligations the APPs impose (Schedule 1)
# ---------------------------------------------------------------------------
#
# One obligation per APP subclause that imposes a requirement ("must",
# "must not"). Object clauses, exceptions, permissions ("may") and
# definitional subclauses (APP 1.1, 2.2, 3.4, 3.7, 4.2, 4.4, 5.2, 6.2, 6.3,
# 6.6, 6.7, 7.2-7.6, 7.8, 8.2, 8.3, 9.3, 11.3, 12.2, 12.3, 12.6, 12.10) are
# clauses, not obligations. Who each binds follows its text: "an APP entity",
# "If an APP entity is an agency/organisation", "an organisation".

obligations:
  - id: OB-PA-APP1-2
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app1/2]
    summary: >
      Take reasonable steps to implement practices, procedures and systems that
      ensure compliance with the APPs and any binding APP code, and enable
      inquiries and complaints to be dealt with.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP1-3
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app1/3]
    summary: Have a clearly expressed and up-to-date APP privacy policy.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP1-4
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app1/4]
    summary: Include in the APP privacy policy the information APP 1.4 lists.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP1-5
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app1/5]
    summary: Take reasonable steps to make the APP privacy policy available free of charge and in an appropriate form.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP1-6
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app1/6]
    summary: Take reasonable steps to give a copy of the APP privacy policy in the form requested.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP2-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app2/1]
    summary: Give individuals the option of not identifying themselves, or of using a pseudonym, unless APP 2.2 applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP3-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app3/1]
    summary: >
      As an agency, collect personal information (other than sensitive
      information) only if reasonably necessary for, or directly related to, its
      functions or activities.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/agency]}
  - id: OB-PA-APP3-2
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app3/2]
    summary: >
      As an organisation, collect personal information (other than sensitive
      information) only if reasonably necessary for its functions or activities.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP3-3
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app3/3]
    summary: Collect sensitive information only with consent and when reasonably necessary, or where APP 3.4 applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP3-5
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app3/5]
    summary: Collect personal information only by lawful and fair means.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP3-6
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app3/6]
    summary: Collect personal information about an individual only from that individual, unless an exception applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP4-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app4/1]
    summary: >
      On receiving unsolicited personal information, determine within a
      reasonable period whether it could have been collected under APP 3.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP4-3
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app4/3]
    summary: >
      Destroy or de-identify unsolicited personal information that could not
      have been collected, where lawful and reasonable and not in a
      Commonwealth record.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP5-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app5/1]
    summary: >
      At or before collection (or as soon as practicable after), take
      reasonable steps to notify the individual of the APP 5.2 matters or
      ensure they are aware of them.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP6-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app6/1]
    summary: >
      Not use or disclose personal information for a secondary purpose unless
      the individual consents or an APP 6.2 or 6.3 exception applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP6-4
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app6/4]
    summary: >
      As an organisation that collected personal information under s16B(2),
      de-identify it before disclosing it under APP 6.1 or 6.2.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP6-5
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app6/5]
    summary: Make a written note of any use or disclosure under APP 6.2(e).
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP7-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app7/1]
    summary: As an organisation, not use or disclose personal information for direct marketing unless an APP 7 exception applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP7-7
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app7/7]
    summary: >
      As an organisation, give effect free of charge, within a reasonable
      period, to an individual's APP 7.6 request about direct marketing.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP8-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app8/1]
    summary: >
      Before disclosing personal information to an overseas recipient, take
      reasonable steps to ensure the recipient does not breach the APPs, unless
      APP 8.2 applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP9-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app9/1]
    summary: As an organisation, not adopt a government related identifier as its own identifier of an individual unless an exception applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP9-2
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app9/2]
    summary: As an organisation, not use or disclose a government related identifier unless an exception applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP10-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app10/1]
    summary: Take reasonable steps to ensure personal information collected is accurate, up-to-date and complete.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP10-2
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app10/2]
    summary: >
      Take reasonable steps to ensure personal information used or disclosed is
      accurate, up-to-date, complete and relevant for the purpose.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP11-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app11/1]
    summary: >
      Take reasonable steps to protect personal information held from misuse,
      interference and loss, and from unauthorised access, modification or
      disclosure.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP11-2
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app11/2]
    summary: >
      Take reasonable steps to destroy or de-identify personal information no
      longer needed for any permitted purpose, unless it is in a Commonwealth
      record or must be retained by law.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP12-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app12/1]
    summary: On request, give an individual access to the personal information held about them, unless APP 12.2 or 12.3 applies.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP12-4
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app12/4]
    summary: >
      Respond to an access request within the APP 12.4 period and give access
      in the manner requested if reasonable and practicable.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP12-5
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app12/5]
    summary: When refusing access, take reasonable steps to give access in a way that meets the needs of both entity and individual.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP12-7
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app12/7]
    summary: As an agency, not charge for an access request or for giving access.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/agency]}
  - id: OB-PA-APP12-8
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app12/8]
    summary: As an organisation that charges for giving access, keep the charge reasonable and not charge for making the request.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/organisation]}
  - id: OB-PA-APP12-9
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app12/9]
    summary: When refusing access (or access in the manner requested), give a written notice with reasons and how to complain.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP13-1
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app13/1]
    summary: >
      Take reasonable steps to correct personal information that is inaccurate,
      out-of-date, incomplete, irrelevant or misleading, on the entity's own
      view or at the individual's request.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP13-2
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app13/2]
    summary: On request, take reasonable steps to notify another APP entity of a correction to information previously disclosed to it.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP13-3
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app13/3]
    summary: When refusing a correction, give a written notice with reasons and how to complain.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP13-4
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app13/4]
    summary: >
      On refusing a correction, associate the individual's statement that the
      information is inaccurate (etc.) with it, if requested.
    valid_from: 2014-03-12
    applies_to: {actors: [privacy-act-1988/actor/app-entity]}
  - id: OB-PA-APP13-5
    clause_ids: [privacy-act-1988:C2026C00227:sch1/app13/5]
    summary: >
      Respond to a correction or statement request within the APP 13.5 period,
      and charge nothing for the request, the correction or the statement.
