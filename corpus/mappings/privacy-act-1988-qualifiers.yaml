# Privacy Act 1988 (Cth): the qualifiers of the obligations privacy-act-1988.yaml
# signs (issue #182, ADR-0044).
#
# Corpus content under D-01: drafted by the model at the human's request,
# reviewed and signed by Lucas Frasca on 2026-10-15, and trimmed by him on
# 2026-10-20 (the erratum below). scripts/load_mappings.py
# refuses any file whose reviewer is still pending. The signed
# privacy-act-1988.yaml is not edited, nor is the exceptions file beside it:
# these entries name the obligations by id.
#
# A qualifier is a clause that says how an obligation is satisfied, or what it
# requires. An exception says when it doesn't apply; the two are kept apart in
# the graph (READ_WITH, not EXCEPTED_BY) and in every answer. A qualifier
# decides nothing about whether the obligation applies. It is what an answer
# citing the obligation must not leave out: Track B's scope includes it and
# the clauses inside it, and answer() delivers them with the obligation's
# clause, marked "how it is satisfied".
#
# Read against the parsed text of the pinned C2026C00227 source (sha256
# 6d0a43e5...), selected by its manifest. The PR's review table quotes each
# qualifier's opening words. The comments below are the model's paraphrase,
# never quotes.
#
# Of privacy-act-1988.yaml's listed non-obligation subclauses, here: 5.2,
# 7.6, 11.3. The draft also had 4.2 and 12.10; the reviewer removed them at
# sign-off as permissions, not qualifiers: "you may do X" doesn't change how
# an obligation is satisfied, it creates a separate allowance, and including
# them would dilute a category that has to mean something precise to a
# reader. Neither an exception nor a qualifier: 1.1 (an object clause), 4.2,
# 12.6 and 12.10 (permissions), 4.4 (says which other principles apply), 6.6
# (a deeming rule: a possible third category, issue #210, not forced into one
# of these two). The rest of that list is in the exceptions file, 3.7
# included.
#
# Erratum (#245, ADR-0050). As signed on 2026-10-15 this file also read
# OB-PA-APP12-5 with APP 12.6 (access may be given through a mutually agreed
# intermediary). On 2026-10-20 the reviewer trimmed it as a permission, like
# 4.2 and 12.10: "If it says "may", it's a permission like 4.2 and 12.10, and
# I'd rather the qualifier category stay precise than keep one borderline
# member. My signature was on the batch, not on that judgement." It is
# removed as an acknowledged erratum, not superseded: the relationship was
# never true at any valid time. The signed version is mappings-2026.10.15
# (d1b3d55); the graph keeps the removal on OB-PA-APP12-5's corrections trail.

author: "model:claude-opus-5-5"
reviewed_by: "Lucas Frasca"
