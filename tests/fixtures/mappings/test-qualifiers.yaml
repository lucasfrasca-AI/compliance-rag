# TEST FIXTURE — invented for the obligation-qualifier tests (issue #182,
# ADR-0044). Not law. Loaded beside test-applicability.yaml and
# test-exceptions.yaml, whose obligations and exceptions it sits beside the
# way a qualifiers file sits beside a signed mapping without editing it.
#
# OB-T-KEEP (s1/1) is qualified by s1/3: it says how keeping the records safe
# is done, and its paragraphs s1/3/a and s1/3/b travel with it. Its exception
