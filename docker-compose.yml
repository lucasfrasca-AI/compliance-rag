# Local Postgres for the Phase 0–1 ledger (SERVICES.md: "Local Postgres (Docker)").
# The schema is not mounted in: a fresh volume starts empty and
# `uv run python -m scripts.migrate_ledger` builds it and records what it applied
# (#293). A volume made by the old initdb.d mount is adopted with
# `--baseline-through NNNN` (SETUP.md).
# Nothing else belongs here: Qdrant and Neo4j are managed free tiers created by
# the human, and the reranker is a Cloud Run service from Phase 1.

services:
  postgres:
    image: postgres:16
    container_name: compliance-rag-ledger
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance_rag
    ports:
      - "5432:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger-data:
